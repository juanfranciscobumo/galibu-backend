name: Deploy a Oracle Cloud (OCI)

# Despliegue automático del backend en la VM OCI.
# El backend y MySQL corren en la misma VM (red podman `galibu`), por lo que la
# latencia de BD es ~1 ms. Lógica: scripts/deploy.sh
#
# Requiere Secrets en GitHub:
#   OCI_HOST=129.38.111.104
#   OCI_USER=opc
#   OCI_SSH_KEY=<clave privada completa, con cabeceras BEGIN/END>
#   OCI_PORT=22
#   FIREBASE_SERVICE_ACCOUNT_JSON=<service-account.json en una sola línea>
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-oci.yml"
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH a OCI
        uses: appleboy/ssh-action@v1.0.3
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          envs: FIREBASE_SERVICE_ACCOUNT_JSON
          command_timeout: 40m
          script_stop: true
          script: |
            set -e
            cd ~/galibu-backend
            git fetch origin main
            git pull --ff-only origin main
            # Firebase Admin: se inyecta el service account en .env en cada deploy
            # (el valor nunca se imprime). Así los push quedan habilitados.
            if [ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
              grep -v '^FIREBASE_SERVICE_ACCOUNT_JSON=' .env > .env.tmp || true
              mv .env.tmp .env
              printf 'FIREBASE_SERVICE_ACCOUNT_JSON=%s\n' "$FIREBASE_SERVICE_ACCOUNT_JSON" >> .env
              echo "FCM: credenciales inyectadas en .env"
            else
              echo "FCM: secret FIREBASE_SERVICE_ACCOUNT_JSON no disponible"
            fi
            bash scripts/deploy.sh
