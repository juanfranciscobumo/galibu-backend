name: Deploy a Oracle Cloud (OCI)

# Despliegue automático del backend (solo backend, DB externa) en la VM OCI.
# Requiere Secrets en GitHub:
#   OCI_HOST=129.38.111.104
#   OCI_USER=opc
#   OCI_SSH_KEY=<clave privada completa, con cabeceras BEGIN/END>
#   OCI_PORT=22
on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/deploy-oci.yml"
      - "src/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy por SSH a OCI
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          script: |
            set -e
            # Limpieza preventiva de espacio antes de construir la imagen.
            sudo podman system prune -af || true
            sudo podman image prune -af || true
            rm -rf ~/.gradle/wrapper/dists ~/.gradle/caches || true
            sudo find /var/log -type f -name "*.log" -size +50M -delete || true
            sudo journalctl --vacuum-size=100M || true
            cd ~/galibu-backend 2>/dev/null && rm -rf build .gradle || true
            cd ~/galibu-backend
            git pull origin main
            # Podman en Oracle Linux 9 (con prefijo sudo). Se usa compose para
            # levantar la BD (mysql) y el backend en la misma VM (latencia ~0).
            if command -v podman-compose >/dev/null 2>&1; then
              sudo podman-compose down || true
              sudo podman-compose up -d --build
            elif podman compose version >/dev/null 2>&1; then
              sudo podman compose down || true
              sudo podman compose up -d --build
            else
              echo "podman-compose no disponible; instalando..."
              sudo dnf install -y podman-compose || sudo pip3 install podman-compose
              sudo podman-compose down || true
              sudo podman-compose up -d --build
            fi
            sudo podman ps
            # Spring tarda en arrancar: reintentar el health check.
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8080/actuator/health >/dev/null 2>&1; then
                echo "backend UP"
                exit 0
              fi
              sleep 5
            done
            echo "health check pendiente: revisar 'sudo podman logs galibu-backend'"
            exit 1
