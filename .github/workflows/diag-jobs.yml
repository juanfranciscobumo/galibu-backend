name: Diag jobs
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          script: |
            sudo podman exec galibu-db mysql -uroot -p"galibu_root_2026" galibu -e "select status, count(*) as n from jobs group by status"
            echo "--- OPEN jobs ---"
            sudo podman exec galibu-db mysql -uroot -p"galibu_root_2026" galibu -e "select id, left(title,30) as title, client_id, professional_id, status, created_at from jobs where status='OPEN' order by created_at desc limit 10"
