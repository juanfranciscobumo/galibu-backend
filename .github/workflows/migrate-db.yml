name: Migrar BD a la VM (MySQL local)

# Migración única: copia la base de datos remota (Aiven) a un MySQL que corre en
# la misma VM que el backend, y reapunta el backend a esa BD local.
#
# Las credenciales remotas se leen DENTRO de la VM desde ~/galibu-backend/.env y
# nunca se imprimen. El volcado queda respaldado en /tmp/galibu_dump.sql y el
# .env anterior en ~/galibu-backend/.env.bak.<fecha>.
#
# Lógica: scripts/migrate-db.sh
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrar BD
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USER }}
          key: ${{ secrets.OCI_SSH_KEY }}
          port: ${{ secrets.OCI_PORT }}
          command_timeout: 60m
          script_stop: true
          script: |
            cd ~/galibu-backend
            git fetch origin main
            git checkout -- . 2>/dev/null || true
            git pull --ff-only origin main
            bash scripts/migrate-db.sh
